  }

    max-width: 100%;

  </div>
  <div style="position:relative;">

    <button id="soundBtn" style="position:absolute; top:6px; right:6px; width:34px; height:34px; border-radius:50%; border:none; background:rgba(0,0,0,0.4); color:#fff; font-size:16px; cursor:pointer;">🔊</button>

    </div>
  </div>

</div>

    <div class="tbtn" id="btnLeft">◀</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GRAVITY = 0.55;
const GROUND_Y = H - 48;

// ---------- サウンド ----------
let soundOn = localStorage.getItem('claudeGames_soundOn');
soundOn = soundOn === null ? true : soundOn === 'true';
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, duration, type, vol, delay) {
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol||0.15, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+duration+0.03);
}
function sfx(name) {
  ensureAudio();
  switch(name) {
    case 'jump': beep(520,0.12,'square',0.12); break;
    case 'coin': beep(880,0.07,'square',0.12); beep(1320,0.09,'square',0.1,0.06); break;
    case 'stomp': beep(180,0.1,'square',0.16); break;
    case 'kick': beep(300,0.08,'square',0.14); break;
    case 'hit': beep(120,0.2,'sawtooth',0.18); break;
    case 'death': beep(320,0.15,'sawtooth',0.15); beep(160,0.3,'sawtooth',0.15,0.15); break;
    case 'stageclear': [660,880,1100,1320].forEach((f,i)=>beep(f,0.15,'square',0.15,i*0.12)); break;
    case 'win': [523,659,784,1047,1319].forEach((f,i)=>beep(f,0.2,'square',0.15,i*0.14)); break;
    case 'gameover': [300,260,220,180].forEach((f,i)=>beep(f,0.22,'sawtooth',0.15,i*0.16)); break;
    case 'bosshit': beep(200,0.15,'square',0.2); beep(140,0.15,'square',0.18,0.08); break;
    case 'powerup': beep(660,0.08,'triangle',0.14); beep(990,0.1,'triangle',0.13,0.07); beep(1320,0.12,'triangle',0.12,0.14); break;
    case 'checkpoint': beep(700,0.1,'triangle',0.13); beep(900,0.12,'triangle',0.12,0.08); break;
    case 'achievement': [784,988,1175].forEach((f,i)=>beep(f,0.12,'triangle',0.14,i*0.09)); break;
  }
}
const soundBtn = document.getElementById('soundBtn');
function updateSoundBtn() { soundBtn.textContent = soundOn ? '🔊' : '🔇'; }
updateSoundBtn();
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  localStorage.setItem('claudeGames_soundOn', soundOn);
  updateSoundBtn();
  if (soundOn) { ensureAudio(); sfx('coin'); }
});

// ---------- 実績(3ゲーム共通・localStorageで共有) ----------
const ACH_KEY = 'claudeGames_achievements';
const STATS_KEY = 'claudeGames_stats';
function getAchievements() {
  try { return JSON.parse(localStorage.getItem(ACH_KEY) || '{}'); } catch(e) { return {}; }
}
function getStats() {
  try { return JSON.parse(localStorage.getItem(STATS_KEY) || '{}'); } catch(e) { return {}; }
}
function incStat(key, amount) {
  const s = getStats();
  s[key] = (s[key]||0) + (amount===undefined?1:amount);
  localStorage.setItem(STATS_KEY, JSON.stringify(s));
  return s[key];
}
const achToastEl = document.getElementById('achToast');
let achToastTimer = null;
function unlockAchievement(id, title) {
  const data = getAchievements();
  if (data[id]) return;
  data[id] = true;
  localStorage.setItem(ACH_KEY, JSON.stringify(data));
  sfx('achievement');
  achToastEl.textContent = '🏆 実績解除: ' + title;
  achToastEl.style.display = 'block';
  clearTimeout(achToastTimer);
  achToastTimer = setTimeout(() => { achToastEl.style.display = 'none'; }, 3000);
}
const ALL_ACHIEVEMENT_IDS = [
  'mario_stage1','mario_allClear','mario_bossDefeat','mario_noDamageStage','mario_kicks5','mario_coins50',
  'shoot_firstWin','shoot_bossDefeat','shoot_enrageCalm','shoot_perfectWave','shoot_powerup10',
  'rpg_firstKill','rpg_shopFriend','rpg_dungeon2','rpg_level10','rpg_trueHero',
];
function isAllAchievementsUnlocked() {
  const data = getAchievements();
  return ALL_ACHIEVEMENT_IDS.every(id => data[id]);
}

// ---------- セーブ ----------
const SAVE_KEY = 'marioSave';
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e) { return null; }
}
function saveProgress() {
  const cur = loadSave() || {};
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    highScore: Math.max(cur.highScore||0, score),
    furthestStage: Math.max(cur.furthestStage||1, currentStage),
  }));
}

// ---------- レベルデータ ----------

function makeEnemy(x, y, dir, range, speed, type) {
  return {x, y, w:32, h:32, dir, range, speed, alive:true, type: type || 'goomba', state:'walk', shellTimer:0};
}
function goomba(x, y, dir, range, speed) { return makeEnemy(x, y, dir, range, speed, 'goomba'); }
function turtle(x, y, dir, range, speed) { return makeEnemy(x, y, dir, range, speed, 'turtle'); }
function bat(x, y, dir, range, speed, amplitude) {
  return {x, y, baseY:y, w:30, h:24, dir, range, speed, amplitude: amplitude||36, phase:Math.random()*Math.PI*2, alive:true, type:'bat'};
}
function spike(x, y, dir, range, speed) {
  return {x, y, baseY:y, w:32, h:26, dir, range, speed, alive:true, type:'spike', hopPhase:Math.random()*Math.PI*2, hopSpeed:0.11+Math.random()*0.04};
}
function plant(x, groundY) {
  return {x, y:groundY, baseY:groundY, hideY:groundY+42, w:26, h:42, dir:1, range:[x,x], speed:0, alive:true, type:'plant', timer:Math.floor(Math.random()*220), visible:false};
}
function kingboss(x, y, range) {
  return {x, y, w:64, h:56, dir:-1, range, speed:1.0, type:'kingboss', alive:true, hitsRemaining:3, invuln:0, fireCooldown:110, chargeCooldown:240, charging:false, chargeTimer:0};
}
function makeCoins(arr) {
  return arr.map(c => ({...c, r:10, taken:false}));
}
// 動く足場: {x,y,w,h, mover:{axis:'x'|'y', range:[min,max], speed, dir}}
function moverPlatform(x, y, w, h, axis, range, speed) {
  return {x, y, w, h, mover:{axis, range, speed, dir:1}};
}

};

function buildLevel(stageNum) {
  const data = STAGE_DATA[stageNum]();
  if (data.movers) {
    data.platforms = data.platforms.concat(data.movers);
  }
  data.gaps = []; // 穴は platforms の切れ目で自然に発生
  data.projectiles = [];
  data.hasBoss = data.enemies.some(e => e.type === 'kingboss');
  data.bossWon = false;
  data.enemies.forEach(e => {
    if (e.speed) e.speed *= difficulty;
    if (e.hopSpeed) e.hopSpeed *= difficulty;
  });
  data.powerups = (POWERUP_SPOTS[stageNum]||[]).map(s => ({x:s.x, y:s.y, type:s.type, r:14, taken:false}));
  data.checkpointFlag = data.hasBoss ? null : {x: Math.round(data.levelWidth*0.5), y: GROUND_Y-56, w:20, h:56, used:false};
  return data;
}

function bindTouchButton(el, code) {

  el.addEventListener('touchend', release, {passive:false});

}

function rectsOverlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function resetLevel(fullReset) {

function getCanvasPos(clientX, clientY) {

function update() {
  if (gameState !== 'playing') return;

  // --- 入力 ---
  const speed = 4.2;
  if (keys['ArrowLeft']) { player.vx = -speed; player.facing = -1; }
  else if (keys['ArrowRight']) { player.vx = speed; player.facing = 1; }
  else { player.vx *= 0.6; }

  if ((keys['Space'] || keys['ArrowUp']) && player.onGround && !player.dead) {
    player.vy = -11.5;
    player.onGround = false;
    sfx('jump');
  }

  if (!player.dead) {
    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;
  } else {
    player.vy += GRAVITY;
    player.y += player.vy;
  }

  // --- 動く足場の移動 ---
  for (const p of level.platforms) {
    if (!p.mover) continue;
    const m = p.mover;
    const delta = m.dir * m.speed;
    if (m.axis === 'x') {
      p.x += delta; p.dx = delta; p.dy = 0;
      if (p.x < m.range[0] || p.x > m.range[1]) m.dir *= -1;
    } else {
      p.y += delta; p.dy = delta; p.dx = 0;
      if (p.y < m.range[0] || p.y > m.range[1]) m.dir *= -1;
    }
  }

  // --- 地面との衝突判定(穴考慮) ---
  player.onGround = false;
  for (const p of level.platforms) {
    if (rectsOverlap(player, p)) {
      // 上からの着地
      const prevBottom = player.y + player.h - player.vy;
      if (player.vy >= 0 && prevBottom <= p.y + 1) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
        if (p.mover && p.mover.axis === 'x') player.x += p.dx;
      } else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 1) {
        // 下から頭ぶつけ
        player.y = p.y + p.h;
        player.vy = 0;
      } else {
        // 横衝突
        if (player.x + player.w/2 < p.x + p.w/2) {
          player.x = p.x - player.w;
        } else {
          player.x = p.x + p.w;
        }
        player.vx = 0;
      }
    }
  }

  if (player.x < 0) player.x = 0;

  // 落下死
  if (player.y > H + 100) {
    killPlayer();
  }

  // --- コイン ---
  for (const c of level.coins) {
    if (c.taken) continue;
    const dx = (player.x+player.w/2) - c.x;
    const dy = (player.y+player.h/2) - c.y;
    if (Math.sqrt(dx*dx+dy*dy) < c.r + 16) {
      c.taken = true;
      coinsCount++;
      score += 50;
      updateHUD();
      sfx('coin');
      const totalCoins = incStat('marioCoinsTotal');
      if (totalCoins >= 50) unlockAchievement('mario_coins50', 'コイン収集家(累計50枚)');
    }
  }

  // --- パワーアップ ---
  for (const pu of level.powerups) {
    if (pu.taken) continue;
    const pdx = (player.x+player.w/2) - pu.x, pdy = (player.y+player.h/2) - pu.y;
    if (Math.sqrt(pdx*pdx+pdy*pdy) < pu.r + 16) {
      pu.taken = true;
      sfx('powerup');
      if (pu.type === 'star') player.starTimer = 480;
      else player.shieldCharge = true;
    }
  }
  if (player.starTimer > 0) player.starTimer--;

  // --- チェックポイント ---
  if (level.checkpointFlag && !level.checkpointFlag.used && rectsOverlap(player, level.checkpointFlag)) {
    level.checkpointFlag.used = true;
    stageCheckpoint = {x: level.checkpointFlag.x, y: GROUND_Y-40};
    sfx('checkpoint');
  }

  // --- 敵 ---
  if (player.invuln > 0) player.invuln--;
  const livesBeforeEnemies = lives;
  for (const e of level.enemies) {
    if (!e.alive) continue;

    if (e.type === 'turtle' && e.state === 'shell-idle') {
      e.shellTimer--;
      if (e.shellTimer <= 0) e.state = 'walk';
    } else if (e.type === 'turtle' && e.state === 'shell-kicked') {
      e.x += e.dir * 9;
      if (e.x < -50 || e.x > level.levelWidth + 50) e.alive = false;
    } else if (e.type === 'bat') {
      e.phase += 0.07;
      e.y = e.baseY + Math.sin(e.phase) * e.amplitude;
      e.x += e.dir * e.speed;
      if (e.x < e.range[0] || e.x + e.w > e.range[1]) e.dir *= -1;
    } else if (e.type === 'spike') {
      e.hopPhase += e.hopSpeed;
      e.y = e.baseY - Math.abs(Math.sin(e.hopPhase))*18 - Math.abs(Math.sin(e.hopPhase*2.7))*6;
      e.x += e.dir * e.speed;
      if (e.x < e.range[0] || e.x + e.w > e.range[1]) e.dir *= -1;
    } else if (e.type === 'plant') {
      e.timer++;
      const t = e.timer % 220;
      if (t < 40) { e.y = e.hideY - (e.hideY-e.baseY)*(t/40); e.visible = true; }
      else if (t < 140) { e.y = e.baseY + Math.sin(t*0.2)*3; e.visible = true; }
      else if (t < 180) { e.y = e.baseY + (e.hideY-e.baseY)*((t-140)/40); e.visible = true; }
      else { e.y = e.hideY; e.visible = false; }
    } else if (e.type === 'kingboss') {
      if (e.invuln > 0) e.invuln--;
      if (e.charging) {
        e.x += e.dir * 5.5;
        e.chargeTimer--;
        if (e.chargeTimer <= 0 || e.x < e.range[0] || e.x + e.w > e.range[1]) {
          e.charging = false;
          e.dir *= -1;
        }
      } else {
        e.x += e.dir * e.speed;
        if (e.x < e.range[0] || e.x + e.w > e.range[1]) e.dir *= -1;
        e.chargeCooldown--;
        if (e.chargeCooldown <= 0) {
          e.charging = true;
          e.chargeTimer = 36;
          e.chargeCooldown = 260;
          e.dir = player.x < e.x ? -1 : 1;
        }
        e.fireCooldown--;
        if (e.fireCooldown <= 0) {
          const fdir = player.x < e.x ? -1 : 1;
          level.projectiles.push({x:e.x+e.w/2, y:e.y+e.h/2-10, vx: fdir*3.2, vy:-7.5});
          e.fireCooldown = 140;
        }
      }
    } else {
      e.x += e.dir * (e.speed || 1.5);
      if (e.x < e.range[0] || e.x + e.w > e.range[1]) e.dir *= -1;
    }

    if (e.type === 'plant' && !e.visible) continue;

    if (!player.dead && rectsOverlap(player, e)) {
      if (player.starTimer > 0) {
        if (e.type === 'kingboss') {
          if (e.invuln === 0) {
            e.hitsRemaining--;
            e.invuln = 70;
            score += 300;
            updateHUD();
            sfx('bosshit');
            if (e.hitsRemaining <= 0) e.alive = false;
          }
        } else {
          e.alive = false;
          score += 100;
          updateHUD();
          sfx('stomp');
        }
        continue;
      }
      const playerBottom = player.y + player.h;
      const fallingOnTop = player.vy > 0 && (playerBottom - player.vy) <= e.y + 10;

      if (e.type === 'kingboss') {
        if (fallingOnTop && e.invuln === 0 && !e.charging) {
          e.hitsRemaining--;
          e.invuln = 70;
          player.vy = -9;
          score += 300;
          updateHUD();
          sfx('bosshit');
          if (e.hitsRemaining <= 0) {
            e.alive = false;
          }
        } else if (player.invuln === 0) {
          damageWithShield(e.x);
        }
      } else if (e.type === 'spike' || e.type === 'plant') {
        if (player.invuln === 0) {
          damageWithShield(e.x);
        }
      } else if (e.type === 'turtle' && e.state === 'walk') {
        if (fallingOnTop) {
          e.state = 'shell-idle';
          e.shellTimer = 240;
          player.vy = -8;
          score += 100;
          updateHUD();
          sfx('stomp');
        } else if (player.invuln === 0) {
          damageWithShield(e.x);
        }
      } else if (e.type === 'turtle' && e.state === 'shell-idle') {
        if (fallingOnTop) {
          e.alive = false;
          player.vy = -8;
          score += 150;
          updateHUD();
          sfx('stomp');
        } else if (player.invuln === 0) {
          e.state = 'shell-kicked';
          e.dir = player.x < e.x ? 1 : -1;
          score += 50;
          updateHUD();
          sfx('kick');
          const kicks = incStat('marioShellKicks');
          if (kicks >= 5) unlockAchievement('mario_kicks5', 'カメ退治マスター(シェルキック5回)');
        }
      } else if (e.type === 'turtle' && e.state === 'shell-kicked') {
        if (fallingOnTop) {
          e.alive = false;
          player.vy = -8;
          score += 150;
          updateHUD();
          sfx('stomp');
        } else if (player.invuln === 0) {
          damageWithShield(e.x);
        }
      } else if (fallingOnTop) {
        e.alive = false;
        player.vy = -8;
        score += 100;
        updateHUD();
        sfx('stomp');
      } else if (player.invuln === 0) {
        damageWithShield(e.x);
      }
    }
  }

  // --- ボスの火球 ---
  if (level.projectiles && level.projectiles.length) {
    for (const pr of level.projectiles) {
      pr.vy += GRAVITY * 0.6;
      pr.x += pr.vx;
      pr.y += pr.vy;
    }
    level.projectiles = level.projectiles.filter(pr => pr.y < H+60 && pr.x > -60 && pr.x < level.levelWidth+60);
    for (const pr of level.projectiles) {
      if (!player.dead && player.invuln === 0 && rectsOverlap(player, {x:pr.x-8, y:pr.y-8, w:16, h:16})) {
        damageWithShield(pr.x);
        pr._used = true;
      }
    }
    level.projectiles = level.projectiles.filter(pr => !pr._used);
  }

  if (lives < livesBeforeEnemies) tookDamageThisStage = true;

  // --- ゴール判定 ---
  if (level.hasBoss) {
    const bossAlive = level.enemies.some(e => e.type === 'kingboss' && e.alive);
    if (!bossAlive && !level.bossWon) {
      level.bossWon = true;
      score += 1000;
      updateHUD();
      gameState = 'win';
      sfx('win');
      if (!tookDamageThisStage) unlockAchievement('mario_noDamageStage', 'ノーダメージクリア');
      unlockAchievement('mario_allClear', '全ステージクリア！');
      unlockAchievement('mario_bossDefeat', '魔王カメ討伐');
      saveProgress();
      showMsg('🎉 魔王カメを倒した！全ステージクリア！！ 🎉  SCORE: ' + score, 'もう一度最初から');
    }
  } else {
    const flag = level.flag;
    if (player.x > flag.x) {
      score += 500;
      updateHUD();
      if (!tookDamageThisStage) unlockAchievement('mario_noDamageStage', 'ノーダメージクリア');
      if (currentStage < TOTAL_STAGES) {
        gameState = 'stageclear';
        sfx('stageclear');
        if (currentStage === 1) unlockAchievement('mario_stage1', '初めの一歩');
        showMsg('🚩 STAGE ' + currentStage + ' クリア！ 🚩', '次のステージへ');
      } else {
        gameState = 'win';
        sfx('win');
        unlockAchievement('mario_allClear', '全ステージクリア！');
        saveProgress();
        showMsg('🎉 全ステージクリア！！ 🎉  SCORE: ' + score, 'もう一度最初から');
      }
    }
  }

  // --- カメラ ---
  camX = Math.max(0, Math.min(player.x - W/2 + player.w/2, level.levelWidth - W));
}

// ---------- 描画 ----------
function drawCloud(x,y,scale) {
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(x,y,20*scale,0,Math.PI*2);
  ctx.arc(x+22*scale,y-10*scale,24*scale,0,Math.PI*2);
  ctx.arc(x+46*scale,y,20*scale,0,Math.PI*2);
  ctx.fill();
}

function drawStalactites() {
  ctx.fillStyle = '#0f1220';
  for (let i=0;i<12;i++) {
    const bx = i*140 - (camX*0.4 % 140);
    ctx.beginPath();
    ctx.moveTo(bx, 0);
    ctx.lineTo(bx+22, 0);
    ctx.lineTo(bx+11, 46);
    ctx.closePath();
    ctx.fill();
  }
}

function drawEmbers() {
  ctx.fillStyle = 'rgba(255,150,60,0.85)';
  for (let i=0;i<16;i++) {
    const seed = i*173.2;
    const ex = (seed*11 - camX*0.2) % (W+40);
    const ex2 = ex < 0 ? ex + W + 40 : ex;
    const ey = H - ((Date.now()/18 + seed) % H);
    ctx.beginPath();
    ctx.arc(ex2, ey, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawGround(p, theme) {
  const x0 = p.x - camX;
  ctx.fillStyle = theme.groundBody;
  ctx.fillRect(x0, p.y, p.w, p.h);
  ctx.fillStyle = theme.groundTop;
  ctx.fillRect(x0, p.y, p.w, 10);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  for (let i=0; i<p.w; i+=24) {
    ctx.fillRect(x0+i, p.y+10, 2, p.h-10);
  }
}

function drawPlatform(p, theme) {
  const x0 = p.x - camX;
  ctx.fillStyle = p.mover ? '#7d8a99' : theme.platform;
  ctx.fillRect(x0, p.y, p.w, p.h);
  ctx.fillStyle = p.mover ? '#b9c4cf' : theme.platformTop;
  ctx.fillRect(x0, p.y, p.w, 6);
  if (p.mover) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0+2, p.y+2, p.w-4, p.h-4);
  }
}

function drawCoin(c) {
  if (c.taken) return;
  const x0 = c.x - camX;
  const bob = Math.sin(Date.now()/200 + c.x) * 3;
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath();
  ctx.arc(x0, c.y+bob, c.r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#c98f13';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawEnemy(e) {
  if (!e.alive) return;
  if (e.type === 'plant' && !e.visible) return;
  if (e.type === 'turtle') drawTurtle(e);
  else if (e.type === 'bat') drawBat(e);
  else if (e.type === 'spike') drawSpike(e);
  else if (e.type === 'plant') drawPlant(e);
  else if (e.type === 'kingboss') drawKingBoss(e);
  else drawGoomba(e);
}

function drawKingBoss(e) {
  const x0 = e.x - camX;
  const cx = x0 + e.w/2, cy = e.y + e.h/2;
  const squash = e.invuln > 0 ? 1 - 0.12*Math.min(1, e.invuln/60) : 1;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, squash);
  ctx.fillStyle = e.charging ? '#7a1f9b' : '#4a1f6b';
  ctx.beginPath();
  ctx.ellipse(0, 4, e.w/2, e.h/2-4, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2e1245';
  for (let i=-2;i<=2;i++) {
    ctx.beginPath();
    ctx.moveTo(i*13, -e.h/2+10);
    ctx.lineTo(i*13-6, -e.h/2-6);
    ctx.lineTo(i*13+6, -e.h/2-6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath();
  ctx.moveTo(-15,-e.h/2-2); ctx.lineTo(-15,-e.h/2-16); ctx.lineTo(-7,-e.h/2-5);
  ctx.lineTo(0,-e.h/2-18); ctx.lineTo(7,-e.h/2-5); ctx.lineTo(15,-e.h/2-16); ctx.lineTo(15,-e.h/2-2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ff5c3d';
  ctx.beginPath();
  ctx.arc(-13,-2,5,0,Math.PI*2); ctx.arc(13,-2,5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-13,-2,2,0,Math.PI*2); ctx.arc(13,-2,2,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  // HPバー(画面固定表示)
  const pct = Math.max(0, e.hitsRemaining/3);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W/2-100, 16, 200, 14);
  ctx.fillStyle = pct > 0.34 ? '#4fd18a' : '#ff5c5c';
  ctx.fillRect(W/2-100, 16, 200*pct, 14);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W/2-100, 16, 200, 14);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('魔王カメ', W/2, 12);
}

function drawProjectile(pr) {
  const x0 = pr.x - camX;
  ctx.fillStyle = '#ff6b1a';
  ctx.beginPath();
  ctx.arc(x0, pr.y, 9, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ffd54a';
  ctx.beginPath();
  ctx.arc(x0, pr.y, 4, 0, Math.PI*2);
  ctx.fill();
}

function drawBat(e) {
  const x0 = e.x - camX;
  const flap = Math.sin(e.phase*3) * 9;
  ctx.fillStyle = '#4a2f5c';
  ctx.beginPath();
  ctx.moveTo(x0+e.w/2-3, e.y+e.h/2);
  ctx.lineTo(x0-8, e.y+e.h/2-8-flap);
  ctx.lineTo(x0+2, e.y+e.h/2+7);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x0+e.w/2+3, e.y+e.h/2);
  ctx.lineTo(x0+e.w+8, e.y+e.h/2-8-flap);
  ctx.lineTo(x0+e.w-2, e.y+e.h/2+7);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#2e1f38';
  ctx.beginPath();
  ctx.ellipse(x0+e.w/2, e.y+e.h/2, e.w/2-6, e.h/2-3, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x0+e.w/2-6, e.y+e.h/2-6);
  ctx.lineTo(x0+e.w/2-9, e.y+e.h/2-14);
  ctx.lineTo(x0+e.w/2-3, e.y+e.h/2-6);
  ctx.moveTo(x0+e.w/2+6, e.y+e.h/2-6);
  ctx.lineTo(x0+e.w/2+9, e.y+e.h/2-14);
  ctx.lineTo(x0+e.w/2+3, e.y+e.h/2-6);
  ctx.fill();
  ctx.fillStyle = '#ff5c5c';
  ctx.beginPath();
  ctx.arc(x0+e.w/2-4, e.y+e.h/2-1, 2, 0, Math.PI*2);
  ctx.arc(x0+e.w/2+4, e.y+e.h/2-1, 2, 0, Math.PI*2);
  ctx.fill();
}

function drawSpike(e) {
  const x0 = e.x - camX;
  const cx = x0+e.w/2, cy = e.y+e.h/2;
  const rBody = e.w/2-4, rSpike = e.w/2+7;
  ctx.fillStyle = '#3a1f6b';
  for (let i=0;i<8;i++) {
    const ang = (Math.PI*2/8)*i + e.hopPhase*0.6;
    const x2 = cx+Math.cos(ang-0.16)*rBody, y2 = cy+Math.sin(ang-0.16)*rBody;
    const x3 = cx+Math.cos(ang+0.16)*rBody, y3 = cy+Math.sin(ang+0.16)*rBody;
    const xt = cx+Math.cos(ang)*rSpike, yt = cy+Math.sin(ang)*rSpike;
    ctx.beginPath();
    ctx.moveTo(x2,y2); ctx.lineTo(xt,yt); ctx.lineTo(x3,y3); ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#5b3aa0';
  ctx.beginPath();
  ctx.arc(cx, cy, rBody, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath();
  ctx.arc(cx-5, cy-2, 3, 0, Math.PI*2);
  ctx.arc(cx+5, cy-2, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx-5, cy-2, 1.3, 0, Math.PI*2);
  ctx.arc(cx+5, cy-2, 1.3, 0, Math.PI*2);
  ctx.fill();
}

function drawPlant(e) {
  const x0 = e.x - camX;
  const lean = Math.max(-8, Math.min(8, (player.x - e.x) * 0.05));
  const headY = e.y;
  const baseBottom = e.hideY + e.h;
  ctx.strokeStyle = '#2f6b2f';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(x0+e.w/2, baseBottom);
  ctx.quadraticCurveTo(x0+e.w/2+lean*0.5, (headY+baseBottom)/2, x0+e.w/2+lean, headY+10);
  ctx.stroke();
  const squash = 1 + Math.sin(e.timer*0.2)*0.06;
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.ellipse(x0+e.w/2+lean, headY, (e.w/2)*squash, e.h/2.6, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  for (let i=-2;i<=2;i++) {
    ctx.beginPath();
    ctx.moveTo(x0+e.w/2+lean+i*5, headY);
    ctx.lineTo(x0+e.w/2+lean+i*5-2, headY+6);
    ctx.lineTo(x0+e.w/2+lean+i*5+2, headY+6);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#ffeb3b';
  ctx.beginPath();
  ctx.arc(x0+e.w/2+lean-6, headY-6, 2.5, 0, Math.PI*2);
  ctx.arc(x0+e.w/2+lean+6, headY-6, 2.5, 0, Math.PI*2);
  ctx.fill();
}

function drawGoomba(e) {
  const x0 = e.x - camX;
  ctx.fillStyle = '#8d4a2f';
  ctx.beginPath();
  ctx.ellipse(x0+e.w/2, e.y+e.h/2+4, e.w/2, e.h/2-2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#3a1f12';
  ctx.beginPath();
  ctx.arc(x0+e.w/2-7, e.y+e.h/2, 4, 0, Math.PI*2);
  ctx.arc(x0+e.w/2+7, e.y+e.h/2, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x0+e.w/2-7, e.y+e.h/2, 2, 0, Math.PI*2);
  ctx.arc(x0+e.w/2+7, e.y+e.h/2, 2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#3a1f12';
  ctx.fillRect(x0+4, e.y+e.h-6, 8, 6);
  ctx.fillRect(x0+e.w-12, e.y+e.h-6, 8, 6);
}

function drawTurtle(e) {
  const x0 = e.x - camX;
  const inShell = e.state !== 'walk';
  if (inShell) {
    ctx.fillStyle = '#3a7d3a';
    ctx.beginPath();
    ctx.ellipse(x0+e.w/2, e.y+e.h/2+8, e.w/2, e.h/2-8, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#26522a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x0+e.w/2, e.y+e.h/2);
    ctx.lineTo(x0+e.w/2, e.y+e.h);
    ctx.moveTo(x0+6, e.y+e.h/2+2);
    ctx.lineTo(x0+e.w-6, e.y+e.h/2+2);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(x0+3, e.y+12, e.w-6, e.h-16);
    ctx.fillStyle = '#3a7d3a';
    ctx.beginPath();
    ctx.ellipse(x0+e.w/2, e.y+e.h/2+2, e.w/2-2, e.h/2-8, 0, Math.PI, 0);
    ctx.fill();
    ctx.strokeStyle = '#26522a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0+e.w/2, e.y+4);
    ctx.lineTo(x0+e.w/2, e.y+e.h/2+2);
    ctx.stroke();
    const headX = e.dir > 0 ? x0+e.w-4 : x0+4;
    ctx.fillStyle = '#8bc34a';
    ctx.beginPath();
    ctx.arc(headX, e.y+e.h/2-4, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(headX + (e.dir>0?3:-3), e.y+e.h/2-6, 1.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#3a7d3a';
    ctx.fillRect(x0+4, e.y+e.h-6, 6, 6);
    ctx.fillRect(x0+e.w-10, e.y+e.h-6, 6, 6);
  }
}

function drawFlag(f) {
  const x0 = f.x - camX;
  ctx.fillStyle = '#aaa';
  ctx.fillRect(x0, f.y, f.w, f.h);
  ctx.fillStyle = '#e63946';
  ctx.beginPath();
  ctx.moveTo(x0+f.w, f.y+8);
  ctx.lineTo(x0+f.w+34, f.y+22);
  ctx.lineTo(x0+f.w, f.y+36);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#deb04a';
  ctx.beginPath();
  ctx.arc(x0+f.w/2, f.y, 8, 0, Math.PI*2);
  ctx.fill();
}

function drawPlayer() {
  if (player.invuln > 0 && player.starTimer <= 0 && Math.floor(player.invuln/4)%2===0) return; // 点滅
  const x0 = player.x - camX;
  ctx.save();
  ctx.translate(x0+player.w/2, player.y+player.h/2);
  if (player.dead) ctx.rotate(Math.PI);
  ctx.translate(-player.w/2, -player.h/2);
  let bodyColor = '#e63946', capColor = '#e63946';
  if (player.starTimer > 0) {
    const hue = (Date.now()/8) % 360;
    bodyColor = 'hsl(' + hue + ',85%,55%)';
    capColor = 'hsl(' + ((hue+120)%360) + ',85%,55%)';
  } else if (isAllAchievementsUnlocked()) {
    bodyColor = '#ffd54a'; capColor = '#e0a800';
  }
  // 体
  ctx.fillStyle = bodyColor;
  ctx.fillRect(0, 14, player.w, player.h-14);
  // 頭
  ctx.fillStyle = '#ffd6a5';
  ctx.fillRect(4, 0, player.w-8, 16);
  // 帽子
  ctx.fillStyle = capColor;
  ctx.fillRect(0, 0, player.w, 8);
  ctx.fillRect(player.facing>0 ? player.w-6 : 0, 6, 10, 4);
  // 目
  ctx.fillStyle = '#222';
  ctx.fillRect(player.facing>0 ? player.w-10 : 4, 6, 3, 3);
  if (player.shieldCharge) {
    ctx.strokeStyle = 'rgba(139,255,157,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.w/2, player.h/2, player.w/2+8, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPowerup(pu) {
  if (pu.taken) return;
  const x0 = pu.x - camX;
  const bob = Math.sin(Date.now()/220 + pu.x) * 3;
  ctx.save();
  ctx.translate(x0, pu.y+bob);
  if (pu.type === 'star') {
    ctx.fillStyle = '#ffd54a';
    ctx.strokeStyle = '#c98f13';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i=0;i<5;i++) {
      const ang = -Math.PI/2 + i*(Math.PI*2/5);
      const ang2 = ang + Math.PI/5;
      ctx.lineTo(Math.cos(ang)*13, Math.sin(ang)*13);
      ctx.lineTo(Math.cos(ang2)*5.5, Math.sin(ang2)*5.5);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.fillStyle = '#e63946';
    ctx.beginPath();
    ctx.arc(0, -2, 12, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-12, -2, 24, 8);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-6, -5, 3, 0, Math.PI*2);
    ctx.arc(6, -8, 2.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawCheckpoint(cf) {
  if (!cf) return;
  const x0 = cf.x - camX;
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x0, cf.y+cf.h);
  ctx.lineTo(x0, cf.y);
  ctx.stroke();
  ctx.fillStyle = cf.used ? '#4fd18a' : 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.moveTo(x0, cf.y);
  ctx.lineTo(x0+22, cf.y+8);
  ctx.lineTo(x0, cf.y+16);
  ctx.closePath();
  ctx.fill();
}

function drawMenu() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#7ec0ee');
  grad.addColorStop(1, '#cdeaff');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  drawCloud(100, 80, 1.2);
  drawCloud(600, 60, 0.9);
  ctx.fillStyle = '#3a2a1a';
  ctx.font = 'bold 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('スーパー なんちゃってマリオ', W/2, 130);
  ctx.font = '16px sans-serif';
  ctx.fillText('むずかしさを選んでね', W/2, 200);

  const save = loadSave();
  if (save) {
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#5a3a1a';
    ctx.fillText('つづき: STAGE ' + save.furthestStage + ' から / ハイスコア ' + save.highScore, W/2, 226);
  }

  for (const b of MENU_BUTTONS) {
    const preset = DIFF_PRESETS[b.key];
    ctx.fillStyle = '#ffcc33';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#2a1a08';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(preset.label, b.x+b.w/2, b.y+30);
    ctx.font = '12px sans-serif';
    ctx.fillText('残機'+preset.lives, b.x+b.w/2, b.y+52);
  }
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#3a2a1a';
  ctx.fillText('← → : 移動 / Space : ジャンプ / ⭐スターは無敵 🍄キノコは1回だけ被弾防止', W/2, 360);
}

function draw() {
  ctx.clearRect(0,0,W,H);
  if (gameState === 'menu') { drawMenu(); return; }
  const theme = THEMES[currentStage];

  // 空(ステージごとのグラデーション)
  const skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0, theme.skyTop);
  skyGrad.addColorStop(1, theme.skyBottom);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,H);

  // 装飾(雲 / 鍾乳石 / 火の粉)
  if (theme.deco === 'clouds') {
    drawCloud(80 - camX*0.3 % (W+200), 60, 1);
    drawCloud(320 - camX*0.3 % (W+200), 100, 0.7);
    drawCloud(600 - camX*0.3 % (W+200), 50, 1.2);
  } else if (theme.deco === 'stalactites') {
    drawStalactites();
  } else if (theme.deco === 'embers') {
    drawEmbers();
  }

  // 遠景の山
  ctx.fillStyle = theme.mountain;
  for (let i=0;i<6;i++) {
    const bx = i*400 - (camX*0.5 % 400) - 200;
    ctx.beginPath();
    ctx.moveTo(bx, GROUND_Y);
    ctx.lineTo(bx+120, GROUND_Y-140);
    ctx.lineTo(bx+240, GROUND_Y);
    ctx.fill();
  }

  for (const p of level.platforms) {
    if (p.y >= GROUND_Y) drawGround(p, theme); else drawPlatform(p, theme);
  }
  drawCheckpoint(level.checkpointFlag);
  for (const c of level.coins) drawCoin(c);
  for (const pu of level.powerups) drawPowerup(pu);
  for (const e of level.enemies) drawEnemy(e);
  if (level.projectiles) for (const pr of level.projectiles) drawProjectile(pr);
  if (!level.hasBoss || !level.bossWon) drawFlag(level.flag);
  drawPlayer();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

updateHUD();
loop();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
